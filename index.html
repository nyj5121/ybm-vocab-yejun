function record(){
 const t=recText();
 A.innerHTML=`<div class="top"><a class="l" id="bk">← 처음으로</a><span>기록</span></div><div class="card"><div class="sub">이 내용을 채팅에 붙여 넣으면 학습기록 파일에 반영할 수 있어요.</div><textarea id="tx" readonly>${esc(t)}</textarea><div class="row"><button class="btn" id="cp">복사</button></div><div class="msg" id="ms"></div></div>
<div class="card"><b>백업 코드</b><div class="sub" style="margin:4px 0 8px">다른 기기·브라우저로 옮기거나 백업할 때 써요. 코드를 복사해 두고, 새 기기에서 붙여넣어 불러오면 지금 기록과 합쳐져요.</div><textarea id="bk2" readonly>${esc(JSON.stringify(ST))}</textarea><div class="row"><button class="btn ghost" id="bkc">백업 코드 복사</button></div>
 <textarea id="imp" placeholder="여기에 백업 코드를 붙여넣기" style="margin-top:10px;height:90px"></textarea><div class="row"><button class="btn" id="bki">불러오기(합치기)</button></div><div class="msg" id="bm"></div></div>
 <div class="card"><div class="sub" id="sy2">${syLabel()}</div>${(window.claude&&window.claude.use)?'':`<div style="margin-top:10px"><b>클라우드 동기화</b> <span class="sub">(설치한 앱·단독 파일용, 무료 Firebase)</span><input type="text" id="cpid" placeholder="프로젝트 ID" style="font-size:15px;margin-top:8px;text-align:left" value="${esc((cfgGet()||{}).pid||'')}"><input type="text" id="ck" placeholder="API 키" style="font-size:15px;margin-top:8px;text-align:left" value="${esc((cfgGet()||{}).key||'')}"><input type="text" id="cc" placeholder="동기화 코드 (기기마다 똑같이)" style="font-size:15px;margin-top:8px;text-align:left" value="${esc((cfgGet()||{}).code||'')}"><div class="row"><button class="btn ghost sm" id="cg">코드 새로 만들기</button><button class="btn sm" id="cs">저장하고 동기화</button></div><div class="sub" style="margin-top:6px">설정 방법은 함께 드린 안내 파일을 보세요. 동기화 코드는 비밀번호처럼 다른 사람에게 알려 주지 마세요.</div></div>`}</div>
 <div class="card"><div class="sub">헷갈린 단어(학습 모드 기준): ${V.filter(v=>isWeak(v.w)).map(v=>v.w).join(', ')||'없음'}</div></div>
 <div class="row"><button class="btn ghost" id="rs">기록 전체 초기화</button></div>`;back();
 $('cp').onclick=()=>{try{navigator.clipboard.writeText(t).then(()=>{$('ms').textContent='복사했어요.'},()=>{$('tx').select();$('ms').textContent='길게 눌러서 복사해 주세요.'})}catch(e){$('tx').select();$('ms').textContent='길게 눌러서 복사해 주세요.'}};
$('bkc').onclick=()=>{const v=JSON.stringify(ST);try{navigator.clipboard.writeText(v).then(()=>{$('bm').textContent='복사했어요.'},()=>{$('bk2').select();$('bm').textContent='길게 눌러서 복사해 주세요.'})}catch(e){$('bk2').select();$('bm').textContent='길게 눌러서 복사해 주세요.'}};
 $('bki').onclick=()=>{try{const r=JSON.parse($('imp').value.trim());if(!r||typeof r!=='object'||!r.w)throw 0;ST=mergeST(ST,r);normST();save();$('bm').innerHTML='<span class="good">합쳤어요. 단어 '+Object.keys(ST.w).length+'개 기록</span>'}catch(e){$('bm').innerHTML='<span class="bad">백업 코드가 올바르지 않아요.</span>'}};
 if($('cg'))$('cg').onclick=()=>{const a=new Uint8Array(24);(window.crypto||{getRandomValues:x=>x.forEach((_,i)=>x[i]=Math.random()*256)}).getRandomValues(a);$('cc').value=[...a].map(b=>'abcdefghijkmnpqrstuvwxyz23456789'[b%32]).join('')};
 if($('cs'))$('cs').onclick=async()=>{const c={pid:$('cpid').value.trim(),key:$('ck').value.trim(),code:$('cc').value.trim()};if(!c.pid||!c.key||c.code.length<20){$('bm').innerHTML='<span class="bad">프로젝트 ID, API 키, 20자 이상의 코드를 모두 넣어 주세요.</span>';return}try{localStorage.setItem('ybm_cfg',JSON.stringify(c))}catch(e){}await syncInit();const e=$('sy2');if(e)e.textContent=syLabel();$('bm').textContent=SY.st==='ok'?'연결됐어요.':'연결을 확인하지 못했어요. 프로젝트 ID, API 키, 규칙 설정을 확인해 주세요.'};
 $('rs').onclick=()=>{if($('rs').dataset.c){ST={w:{},iss:{},rounds:[],notes:{},ans:[]};save();home()}else{$('rs').dataset.c=1;$('rs').textContent='한 번 더 누르면 모든 기록이 지워져요'}}}
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
 if(/^[1-5]$/.test(e.key)){const o=A.querySelectorAll('.card > .opt')[+e.key-1];if(o){o.click();return}}
 if(e.key===' '||e.key==='Enter'){const b=$('nx')&&$('nx').querySelector('button');if(b){e.preventDefault();b.click();return}const c=$('c');if(c){e.preventDefault();c.click()}}
 if(e.key==='ArrowRight'&&$('ok'))$('ok').click();if(e.key==='ArrowLeft'&&$('no'))$('no').click()});
home();syncInit();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script></body></html>
